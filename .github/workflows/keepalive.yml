name: keep-supabase-awake
# Supabase free projects pause after 7 days without activity; ping every day.
# GitHub disables scheduled workflows after 60 days without repository activity;
# the second step re-enables this workflow on every run, which resets that timer.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "https://tqgfwcumuhxbcebofavf.supabase.co/rest/v1/rpc/is_allowed_email" \
            -H "apikey: sb_publishable_BSTP8Ll5WtzyCbez6dPLxQ_P5ro5K7m" \
            -H "Content-Type: application/json" \
            -d '{"p_email":"keepalive@example.com"}'
      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
